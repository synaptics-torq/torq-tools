# Smoke-test that every model exporter runs end-to-end to ONNX.
#
# ONNX-only (`--skip-torq`): GitHub-hosted runners have neither the Torq
# compiler nor torq.runtime, so this stops at the ONNX stage and never touches
# the IREE/vmfb path. Each model is a separate matrix job so disk (model
# downloads) is per-model and one failure doesn't hide the others
# (fail-fast: false).
#
# gemma3 pulls the gated google/gemma-3-* repos and the private Synaptics liquid
# ONNX mirror, so an HF_TOKEN secret (with the Gemma license accepted) is
# required for gemma3; the other three fall back to public repos.
name: Export models

on:
  workflow_dispatch:
  push:
    branches:
      - wip/ci-export

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: moonshine
            args: moonshine --skip-torq all --skip-validation
          - model: smollm2
            args: smollm2 -s 135M --skip-torq --skip-validation
          - model: gemma3
            args: gemma3 -s 270m --skip-torq --skip-validation
          - model: liquid
            args: liquid -s 230m --skip-torq --skip-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          # Model downloads + the torch/optimum install need room; strip the
          # largest preinstalled toolchains we don't use.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Add swap space
        run: |
          # The static shape-propagation pass constant-folds a ~1 GB ONNX graph
          # and peaks above the 7 GB runner RAM (OOM surfaces as a job
          # cancellation). ubuntu-latest already ships an active /swapfile that
          # can't be resized in place ("fallocate: Text file busy"), so disable
          # existing swap and create a larger file on the big ephemeral /mnt disk.
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install torq-tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Export ${{ matrix.model }} (ONNX only)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          torq-export-model ${{ matrix.args }} --models-dir "$RUNNER_TEMP/models"

      - name: List produced ONNX
        if: always()
        run: |
          echo "ONNX artifacts under $RUNNER_TEMP/models:"
          find "$RUNNER_TEMP/models" -name '*.onnx' -printf '%10s  %p\n' | sort -k2 || true
