[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torq-tools"
version = "0.9.0"
requires-python = ">=3.12"
authors = [{ "name" = "synaptics-astra", "email" = "zSvcastrateam@synaptics.com" }]
description = "Developer tools for the Torq compiler"
classifiers = [
    "Programming Language :: Python :: 3",
]
license = { "file" = "LICENSE" }
readme = "README.md"
dependencies = [
    "ai_edge_litert==2.1.5",
    "datasets==4.8.5",
    "huggingface_hub==0.36.2",
    "ml_dtypes==0.5.4",
    "numpy==2.5.1",
    "onnx==1.21.0",
    "onnxruntime==1.26.0",
    "onnx_graphsurgeon==0.6.1",
    "optimum[onnxruntime]==2.1.0",
    "polygraphy==0.50.3",
    "pyyaml==6.0.3",
    "tokenizers==0.22.2",
    "torq-compiler==2.2.1",
    "transformers==4.57.6",
]

[project.urls]
Homepage = "https://github.com/synaptics-torq/torq-tools"
Issues = "https://github.com/synaptics-torq/torq-tools/issues"

[project.scripts]
torq-cleanup-model = "torq.model_export.cleanup.__main__:main"
torq-export-model  = "torq.models.export_model:main"
torq-infer-model   = "torq.models.infer_model:main"
torq-synaptics-audio = "torq.models.synaptics_audio.__main__:main"

# NOTE: moonshine_streaming is intentionally NOT declared as an extra here. It
# requires transformers 5.x, which conflicts with the base `optimum[onnxruntime]`
# dependency (optimum-onnx caps transformers <4.58).
[project.optional-dependencies]
moonshine = [
    "soundfile",
    "torchcodec",
    "whisper-openai",
    "jiwer",
    "openpyxl",
    "pandas",
    "tqdm",
]
all = ["torq-tools[moonshine]"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "tests"]
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "graph_edit: graph_edit test suite",
    "unit: unit tests",
    "integration: integration tests",
    "ci: CI-only tests (skipped when the CI environment variable is unset)",
    "ort: tests that execute ONNX Runtime",
    "core: graph editor and import surface tests",
    "arithmetic: arithmetic graph edit tests",
    "shape: shape graph edit tests",
    "padding: padding graph edit tests",
    "conv: convolution graph edit tests",
    "rnn: recurrent graph edit tests",
    "transformer: transformer graph edit tests",
    "artifacts: artifact graph edit tests",
    "custom_ops: LFM2.5 custom-op replacement graph edit tests",
]
